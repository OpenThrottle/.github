<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" fill="none" role="img">
<style>
  .sans { font-family: Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .mono { font-family: 'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace; }
  
  @media (prefers-reduced-motion: no-preference) {
    .streak { animation: zip 2.2s cubic-bezier(.22,1,.36,1) both; }
    .s1 { animation-delay: .15s; } .s2 { animation-delay: .3s; }
    .s3 { animation-delay: .45s; } .s4 { animation-delay: .6s; }
  }
  @keyframes zip {
    0% { transform: translateX(-140px); opacity: 0; }
    100% { transform: translateX(0); }
  }
</style>
<defs>
  <clipPath id="round"><rect width="1280" height="360" rx="16"/></clipPath>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" stroke="#161B20" stroke-width="1"/>
  </pattern>
</defs>
<g clip-path="url(#round)">
  <rect width="1280" height="360" fill="#0A0D0F"/>
  
  <defs>
    <radialGradient id="glow" cx="220" cy="180" r="260" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF0000" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FF0000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="streak" x1="0" x2="1">
      <stop offset="0" stop-color="#FF0000" stop-opacity="0"/>
      <stop offset="1" stop-color="#FF0000"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" x2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset=".75" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="gridmask"><rect width="1280" height="360" fill="url(#fade)"/></mask>
  </defs>
  <rect width="1280" height="360" fill="url(#grid)" mask="url(#gridmask)"/>
  <rect width="1280" height="360" fill="url(#glow)"/>
  <rect class="streak s0" x="920" y="44" width="300" height="3" rx="1.5" fill="url(#streak)" opacity="0.9"/>
  <rect class="streak s1" x="1010" y="62" width="210" height="3" rx="1.5" fill="url(#streak)" opacity="0.5"/>
  <rect class="streak s2" x="960" y="80" width="260" height="3" rx="1.5" fill="url(#streak)" opacity="0.75"/>
  <rect class="streak s3" x="1050" y="98" width="170" height="3" rx="1.5" fill="url(#streak)" opacity="0.4"/>

  <image href="data:image/png;base64," x="92" y="52" width="256" height="256"/>

  <text class="mono" x="380" y="112" font-size="17" letter-spacing="3" fill="#FF0000">OPEN CORE · MCP-NATIVE · LOCAL-FIRST</text>
  <text class="sans" x="376" y="186" font-size="78" font-weight="800" letter-spacing="-2.5" fill="#F7F9FA">OpenThrottle<tspan fill="#FF0000"> AI</tspan></text>
  <text class="sans" x="380" y="236" font-size="25" fill="#7C8892">AI-powered feedback loops that move you 10× to 100× faster,</text>
  <text class="sans" x="380" y="270" font-size="25" fill="#7C8892">without giving up control.</text>
  <text class="mono" x="380" y="320" font-size="19" fill="#F7F9FA">plan <tspan fill="#FF0000">→</tspan> run <tspan fill="#FF0000">→</tspan> validate <tspan fill="#FF0000">→</tspan> ship <tspan fill="#FF0000">→</tspan> remember <tspan fill="#FF0000">↺</tspan></text>
  <rect x="0" y="356" width="1280" height="4" fill="#FF0000" opacity=".9"/>
</g>
<rect x="0.5" y="0.5" width="1279" height="359" rx="15.5" stroke="#20262D"/>
</svg>
